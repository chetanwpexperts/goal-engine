name: security

on:
  pull_request:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install application dependencies and scanners
        id: install
        run: python -m pip install -r requirements.txt pip-audit bandit
      - name: Dependency vulnerability scan
        run: python -m pip_audit -r requirements.txt
      - name: Static security scan (medium and high severity)
        if: ${{ !cancelled() && steps.install.outcome != 'failure' }}
        run: python -m bandit -r app -ll

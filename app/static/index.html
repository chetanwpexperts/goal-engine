<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Goal Engine</title>
  <meta name="description" content="Say what you need, in English, Hindi or Hinglish. Goal Engine understands it and builds an agent that does the work.">
  <meta name="theme-color" content="#EEF1F6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body data-state="idle">
  <header class="bar">
    <a class="mark" href="/" aria-label="Goal Engine">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="8" cy="16" r="4"/><circle cx="24" cy="8" r="4"/><circle cx="24" cy="24" r="4"/><path d="M12 16h4l4-6M16 16l4 6"/></svg>
    </a>
    <nav class="tools">
      <button id="open-goals" type="button" class="tool" aria-label="Your goals" title="Your goals">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h13"/></svg>
      </button>
      <button id="my-agents" type="button" class="tool" aria-label="Your agents" title="Your agents">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 12H12l3.5-4.5M12 12l3.5 4.5"/></svg>
        <span id="agent-count" class="count" hidden></span>
      </button>
      <a href="/privacy" class="tool" aria-label="Privacy and delete my data" title="Privacy">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>
      </a>
      <button id="new-chat" type="button" class="tool" aria-label="Start fresh" title="Start fresh">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </nav>
  </header>

  <main class="stage">
    <section id="thread" class="thread" aria-live="polite"></section>
    <aside id="machine" class="machine" aria-label="Agent">
      <div id="agents"></div>
      <div id="understood" class="understood" hidden></div>
    </aside>
  </main>

  <form id="composer" class="composer">
    <div class="field">
      <textarea id="input" rows="1" maxlength="1500" aria-label="Say what you need"></textarea>
      <div id="ghost" class="ghost" aria-hidden="true"></div>
      <div class="field-meta">
        <span id="wordcount" class="wordcount" hidden></span>
        <button id="mic-lang" type="button" class="mic-lang" hidden></button>
      </div>
    </div>
    <button id="mic" type="button" class="mic" aria-label="Speak instead of typing" title="Speak" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
    </button>
    <button id="send" type="submit" class="send" aria-label="Send">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
    </button>
  </form>
  <div id="options" class="options" hidden></div>
  <p id="fineprint" class="fineprint">Please don't type passwords or card numbers here. <a href="/privacy">Privacy &amp; delete my data</a></p>

  <div id="drawer" class="drawer" hidden>
    <div class="drawer-inner">
      <button type="button" class="drawer-close" aria-label="Close" data-close>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div id="drawer-body"></div>
    </div>
  </div>

  <script src="/static/app.js" defer></script>
</body>
</html>

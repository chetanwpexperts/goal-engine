[program:goal-engine]
directory=/cdata/goal-engine
command=/cdata/goal-engine/.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8098 --workers 2 --proxy-headers
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/cdata/goal-engine/logs/app.log
stderr_logfile=/cdata/goal-engine/logs/app.err.log

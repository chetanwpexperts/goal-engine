services:
  mariadb:
    image: mariadb:11
    container_name: goal-engine-mariadb-test
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: shop_db
      MARIADB_USER: shopapp
      MARIADB_PASSWORD: "app pass"
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - ./scripts/testdb/mariadb-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16
    container_name: goal-engine-postgres-test
    environment:
      POSTGRES_DB: shop_pg
      POSTGRES_USER: shopapp
      POSTGRES_PASSWORD: "app pass"
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - ./scripts/testdb/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopapp -d shop_pg"]
      interval: 5s
      timeout: 5s
      retries: 20

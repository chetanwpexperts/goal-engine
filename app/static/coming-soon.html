<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Goal Engine</title>
  <meta name="theme-color" content="#EEF1F6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { --paper: #EEF1F6; --ink: #1B2340; --muted: #66708A; --line: #D5DBE7; --signal: #F2A33A; --ok: #1F8A7E; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Schibsted Grotesk", system-ui, sans-serif;
           display: grid; place-items: center; padding: 24px 16px; }
    main { width: min(640px, 100%); }
    .mark { width: 44px; height: 44px; }
    .mark circle { fill: var(--ink); }
    .mark circle:first-child { fill: var(--signal); }
    .mark path { stroke: var(--ink); stroke-width: 2; fill: none; }
    h1 { font-size: clamp(40px, 9vw, 72px); line-height: 1; letter-spacing: -0.03em; margin: 28px 0 18px; font-weight: 800; }
    p { font-size: 19px; line-height: 1.55; color: var(--muted); margin: 0; max-width: 34em; }
    .line { margin-top: 40px; display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink); font-weight: 600; }
    .pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 0 0 rgba(242,163,58,.6); animation: pulse 1.8s infinite; }
    @keyframes pulse { 70% { box-shadow: 0 0 0 12px rgba(242,163,58,0); } 100% { box-shadow: 0 0 0 0 rgba(242,163,58,0); } }
    .rule { height: 1px; background: var(--line); margin-top: 40px; }
    small { display: block; margin-top: 16px; color: var(--muted); font-size: 13px; }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 32 32" aria-label="Goal Engine"><circle cx="8" cy="16" r="4"/><circle cx="24" cy="8" r="4"/><circle cx="24" cy="24" r="4"/><path d="M12 16h4l4-6M16 16l4 6"/></svg>
    <h1>Goal Engine</h1>
    <p>Type or speak your problem. Goal Engine understands it and builds an agent that does the work.</p>
    <div class="line"><span class="pulse" aria-hidden="true"></span>Coming soon</div>
    <div class="rule"></div>
    <small>Built by Chetan Sharma · <a href="https://chetanbuilds.com" style="color:inherit">chetanbuilds.com</a></small>
  </main>
</body>
</html>

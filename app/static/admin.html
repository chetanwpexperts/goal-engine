<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Requests · Goal Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --paper: #EEF1F6; --panel: #F8FAFD; --ink: #1B2340; --muted: #66708A; --line: #D5DBE7; --signal: #F2A33A; --signal-soft: #FCEBD2; --ok: #1F8A7E; --ok-soft: #DDF1EE; --alert: #C8463B; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 "Schibsted Grotesk", system-ui, sans-serif; }
    main { max-width: 820px; margin: 0 auto; padding: 32px 16px 80px; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 30px; letter-spacing: -0.02em; }
    .count { color: var(--muted); font-size: 14px; }
    .filters { display: flex; gap: 6px; margin: 20px 0; flex-wrap: wrap; }
    .filters button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 14px; cursor: pointer; color: var(--ink); }
    .filters button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .req { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; margin-bottom: 12px; display: grid; gap: 10px; }
    .req.new { border-left: 4px solid var(--signal); }
    .top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
    .topic { font-weight: 700; font-size: 18px; }
    .when { color: var(--muted); font-size: 13px; }
    .need { white-space: pre-wrap; margin: 0; }
    .who { color: var(--muted); font-size: 14px; }
    .who b { color: var(--ink); }
    .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .acts a, .acts button, .acts select { border: 1px solid var(--ink); border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 14px; font-weight: 600; text-decoration: none; color: var(--ink); background: transparent; cursor: pointer; }
    .acts a.wa { background: var(--ok); border-color: var(--ok); color: #fff; }
    textarea { width: 100%; min-height: 56px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: inherit; font-size: 14px; background: #fff; resize: vertical; }
    .saved { color: var(--ok); font-size: 13px; }
    .empty { color: var(--muted); }
    .learn-head { margin-top: 40px; }
    .lrow { display: flex; gap: 10px; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); padding: 10px 0; flex-wrap: wrap; }
    .lrow .t { flex: 1 1 320px; }
    .lrow small { color: var(--muted); display: block; }
    .lrow button { border: 1px solid var(--ink); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; background: transparent; color: var(--ink); cursor: pointer; }
    h2 { font-size: 18px; margin: 20px 0 4px; }
    a:focus-visible, button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  </style>
</head>
<body>
<main>
  <header><h1>Expert requests</h1><span class="count" id="count"></span></header>
  <div class="filters" id="filters"></div>
  <section id="list"></section>
  <header class="learn-head"><h1>Learning</h1><span class="count" id="lcount"></span></header>
  <p class="who">Sentences people asked the agents to learn ("None of these"), most asked first. The nightly learning reads them too. Below: sentences the brains learned from 3+ people agreeing. Reject anything wrong.</p>
  <section id="learn"></section>
</main>
<script>
(() => {
  const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x !== undefined && x !== null) e.textContent = x; return e; };
  const list = document.getElementById("list");
  const filters = document.getElementById("filters");
  const labels = { "": "All", new: "New", talking: "Talking", done: "Done", spam: "Spam" };
  let status = "new";

  for (const [k, v] of Object.entries(labels)) {
    const b = el("button", null, v); b.type = "button"; b.dataset.k = k;
    b.addEventListener("click", () => { status = k; load(); });
    filters.append(b);
  }

  async function save(id, body, note) {
    const r = await fetch(`/api/admin/requests/${id}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (r.ok && note) { note.textContent = "Saved"; setTimeout(() => { note.textContent = ""; }, 1500); }
    return r.ok;
  }

  async function load() {
    for (const b of filters.children) b.setAttribute("aria-pressed", String(b.dataset.k === status));
    const r = await fetch(`/api/admin/requests?status=${status}`);
    if (!r.ok) { list.replaceChildren(el("p", "empty", "Not signed in. Open your private admin link again.")); return; }
    const { requests } = await r.json();
    document.getElementById("count").textContent = `${requests.length} ${labels[status].toLowerCase()}`;
    if (!requests.length) { list.replaceChildren(el("p", "empty", "Nothing here.")); return; }
    list.replaceChildren(...requests.map((q) => {
      const card = el("article", `req ${q.status}`);
      const top = el("div", "top");
      top.append(el("span", "topic", q.topic), el("span", "when", new Date(`${q.created_at}Z`).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })));
      const who = el("p", "who");
      who.append(el("b", null, q.name), document.createTextNode(` · wants ${q.contact}${q.phone ? " · " + q.phone : ""}${q.email ? " · " + q.email : ""}${q.intent ? " · " + q.intent : ""}`));
      const acts = el("div", "acts");
      if (q.whatsapp) { const a = el("a", "wa", "WhatsApp"); a.href = q.whatsapp; a.target = "_blank"; a.rel = "noopener"; acts.append(a); }
      if (q.phone) { const a = el("a", null, "Call"); a.href = `tel:${q.phone}`; acts.append(a); }
      if (q.email) { const a = el("a", null, "Email"); a.href = `mailto:${q.email}?subject=${encodeURIComponent("Goal Engine: " + q.topic)}`; acts.append(a); }
      const sel = el("select");
      for (const s of ["new", "talking", "done", "spam"]) { const o = el("option", null, labels[s]); o.value = s; o.selected = s === q.status; sel.append(o); }
      const saved = el("span", "saved");
      sel.addEventListener("change", () => save(q.id, { status: sel.value }, saved));
      acts.append(sel, saved);
      const note = el("textarea"); note.placeholder = "Your note (only you see this)"; note.value = q.note || "";
      note.addEventListener("change", () => save(q.id, { note: note.value }, saved));
      card.append(top, el("p", "need", q.need), who, acts, note);
      return card;
    }));
  }

  const learnBox = document.getElementById("learn");
  async function setL(kind, id, status) {
    await fetch(`/api/admin/learning/${kind}/${id}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ status }) });
    loadLearning();
  }
  async function loadLearning() {
    const r = await fetch("/api/admin/learning?status=new");
    if (!r.ok) return;
    const { requests, learned } = await r.json();
    document.getElementById("lcount").textContent = `${requests.length} to learn`;
    const row = (text, meta, buttons) => {
      const d = el("div", "lrow"); const t = el("div", "t", text); t.append(el("small", null, meta)); d.append(t);
      for (const [label, fn] of buttons) { const b = el("button", null, label); b.type = "button"; b.addEventListener("click", fn); d.append(b); }
      return d;
    };
    const parts = [el("h2", null, "Asked to learn")];
    if (!requests.length) parts.push(el("p", "empty", "Nothing waiting."));
    for (const q of requests) parts.push(row(q.text, `${q.brain} · asked ${q.count}× · best guess ${q.guess || "none"}`,
      [["Learned", () => setL("request", q.id, "learned")], ["Ignore", () => setL("request", q.id, "ignored")]]));
    parts.push(el("h2", null, "Learned from users"));
    if (!learned.length) parts.push(el("p", "empty", "Nothing yet."));
    for (const p of learned) parts.push(row(p.text, `${p.brain} → ${p.label} · ${p.status}`,
      p.status === "rejected" ? [["Allow", () => setL("phrase", p.id, "approved")]] : [["Reject", () => setL("phrase", p.id, "rejected")]]));
    learnBox.replaceChildren(...parts);
  }

  load();
  loadLearning();
  setInterval(() => { if (!document.hidden && document.activeElement.tagName !== "TEXTAREA") load(); }, 30000);
})();
</script>
</body>
</html>

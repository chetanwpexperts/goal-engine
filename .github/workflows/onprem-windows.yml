name: On-prem Windows
on:
  pull_request:
    paths:
      - 'deploy/onprem/**'
      - '.github/workflows/onprem-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install, authenticate and uninstall
        shell: pwsh
        run: ./deploy/onprem/windows/test-ci.ps1

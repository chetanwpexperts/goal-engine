# The lab databases DBaba is tested against at night, beside MariaDB and PostgreSQL (docs/lab-server.md).
# Only made-up test data ever goes in. Every port is bound to 127.0.0.1, so nothing is reachable from outside the server,
# and each database has a hard memory and CPU cap so the live site always keeps enough. up.sh starts them, down.sh removes
# them (volumes included) after every run: between runs they use no memory at all.
name: dbaba-lab
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${LAB_PW:?set LAB_PW}
      MSSQL_MEMORY_LIMIT_MB: "1536"
    ports: ["127.0.0.1:14330:1433"]
    mem_limit: 2g
    cpus: 1.5
    networks: [lab]
  oracle:
    # Oracle Database Free, packaged by a long-standing community maintainer (the official image needs an Oracle login)
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: ${LAB_PW:?set LAB_PW}
      APP_USER: lab
      APP_USER_PASSWORD: ${LAB_PW:?set LAB_PW}
    ports: ["127.0.0.1:15210:1521"]
    mem_limit: 2g
    cpus: 1.5
    networks: [lab]
  mongo:
    image: mongo:7.0
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    ports: ["127.0.0.1:27170:27017"]
    mem_limit: 1g
    cpus: 1
    networks: [lab]
networks:
  lab: {}

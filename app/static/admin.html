<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin · Goal Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/admin.css">
  <script src="/static/admin.js" defer></script>
</head>
<body>
  <aside class="nav" id="nav">
    <a class="brand" href="/" title="Open Goal Engine">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="8" cy="16" r="4"/><circle cx="24" cy="8" r="4"/><circle cx="24" cy="24" r="4"/><path d="M12 16h4l4-6M16 16l4 6"/></svg>
      <span>Goal Engine <small>admin</small></span>
    </a>
    <nav>
      <a href="#overview" data-view="overview">Overview</a>
      <a href="#enquiries" data-view="enquiries">Enquiries <span class="badge" id="bEnq" hidden></span></a>
      <a href="#people" data-view="people">People</a>
      <a href="#experts" data-view="experts">Expert requests <span class="badge" id="bExp" hidden></span></a>
      <a href="#dbaba" data-view="dbaba">DBaba knowledge</a>
      <a href="#learning" data-view="learning">Learning <span class="badge" id="bLearn" hidden></span></a>
    </nav>
    <button class="ghost" id="theme" type="button">Light / dark</button>
  </aside>

  <main id="main">
    <header class="head">
      <h1 id="title">Overview</h1>
      <span class="sub" id="sub"></span>
      <span class="grow"></span>
      <button class="ghost" id="reload" type="button">Reload</button>
    </header>

    <section class="view" id="v-overview"></section>
    <section class="view" id="v-enquiries" hidden></section>
    <section class="view" id="v-people" hidden></section>
    <section class="view" id="v-experts" hidden></section>
    <section class="view" id="v-dbaba" hidden></section>
    <section class="view" id="v-learning" hidden></section>
  </main>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
